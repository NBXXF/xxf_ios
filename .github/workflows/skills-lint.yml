name: Skills Lint

on:
  push:
    paths:
      - 'skills/**'
      - 'scripts/validate-skills.py'
      - '.github/workflows/skills-lint.yml'
  pull_request:
    paths:
      - 'skills/**'
      - 'scripts/validate-skills.py'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run skill validator
        run: python3 scripts/validate-skills.py
